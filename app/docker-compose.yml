# Proposal Scorer v0 (BACKEND.md §4). Run from this folder: `docker compose up -d --build`.
# Only nginx gets a host port; browser → nginx:80 → /api/* backend, /* frontend.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    # Published so `uv run` on the host can reach it too; drop for prod.
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file:
      - path: .env
        required: false            # defaults in config.py apply until you `cp .env.example .env`
    depends_on:
      ollama:
        condition: service_started
    # no host port — nginx reaches it on the network as backend:8000
    expose:
      - "8000"
    volumes:
      - ./data:/app/data             # extraction cache + regression outputs persist
      - ../sample_data:/sample_data:ro   # the 6 sponsor .md files, for tests/regression.py

  frontend:
    # Placeholder so nginx has something on "/". The real app is ../frontend; give it a
    # Dockerfile that serves on :3000 and point `build` there.
    build: ./frontend-placeholder
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  ollama_models:
