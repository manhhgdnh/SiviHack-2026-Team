# Proposal Scorer. Run from this folder: `docker compose up -d --build` (or `./run.sh up`).
# Only nginx gets a host port; browser → nginx:80 → /api/* backend, /* frontend.
# Gemini is the default provider; the local Ollama service only starts with
# `docker compose --profile ollama up` (LLM_PROVIDER=ollama in .env).
services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    # Published so `uv run` on the host can reach it too; drop for prod.
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file:
      - path: .env
        required: false            # defaults in config.py apply until you `cp .env.example .env`
    # no host port — nginx reaches it on the network as backend:8000
    expose:
      - "8000"
    volumes:
      - ./data:/app/data             # LLM cache + usage ledger + regression outputs persist
      - ../sample_data:/sample_data:ro   # the 6 sponsor .md files, for tests/regression.py

  frontend:
    # The Vite build served by nginx on :3000 (see ../frontend/Dockerfile).
    build: ../frontend
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  ollama_models:
