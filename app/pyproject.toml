[project]
name = "router"
version = "0.1.0"
description = "Task classification + routing demo"
authors = [
    { name = "UNtergas", email = "mycomputerer135@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-genai==2.24.0",
    "python-dotenv>=1.2.3",
    "pydantic-settings>=2.10",
    "datasets>=5.0.1",
    "fastapi[standard]>=0.141.1",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "sqlmodel>=0.0.42",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ruff>=0.16.7",
]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# hackathon-sane defaults: pyflakes(F) + pycodestyle(E) + imports(I) + bugbear(B) + pyupgrade(UP)
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]        # let the formatter handle line length
